name: HoppyBeat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HoppyBeat:
    type: application
    platform: iOS
    sources:
      - HoppyBeat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hoppybeat
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hoppy Beat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.kids-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  HoppyBeatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HoppyBeatUITests
    dependencies:
      - target: HoppyBeat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hoppybeat.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  HoppyBeat:
    build:
      targets:
        HoppyBeat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HoppyBeatUITests
    archive:
      config: Release
